# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft / NeoForge versions
minecraft_version=1.21.1
minecraft_version_range=[1.21,1.21.2)
neo_version=21.1.265
# FancyModLoader major version bundled with NeoForge 21.1.x
loader_version_range=[4,)

# Parchment mappings (community parameter names and javadocs on top of official mappings)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Mod properties
# The unique mod identifier. Must be lowercase and match the @Mod annotation in the main class.
mod_id=wrenchslot
# The human-readable display name for the mod.
mod_name=Wrench Slot
# The license of the mod, using an SPDX identifier where possible.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=1.0.0
# The group ID / base package used for the mod sources.
mod_group_id=com.proto781m.wrenchslot
# The authors of the mod, displayed in the mod list.
mod_authors=Proto781M
# The description of the mod, displayed in the mod list.
mod_description=A NeoForge mod for Minecraft 1.21.1.
